# Workflows you run for the meble cabinet project.   Runner: https://taskfile.dev
#   Install once:   brew install go-task
#   See tasks:      task --list
#
# Designing/editing cabinets happens in a Claude Code session (just ask). The lower-level internals
# (scaffold a carcass, stamp fitting holes) are run for you there via `python -m meble …`; you don't
# invoke them by hand, so they're not tasks here.
#
# Most tasks take an optional scope after `--`, e.g.  task pdf -- --cabinet open-900
# (default scope is the kitchen set / bohaterow apartment).
version: '3'

env:
  PYTHONPATH: tools

vars:
  PY: .venv/bin/python

tasks:
  default:
    desc: "List available tasks"
    cmds: ["task --list"]
    silent: true

  setup:
    desc: "Create the venv and install dependencies (run once)"
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -q -r tools/requirements.txt
      - echo "✓ ready — try 'task list'"

  list:
    desc: "List apartments, sets, cabinets and library contents"
    cmds: ["{{.PY}} -m meble list"]

  review:
    desc: "Check designs before ordering — schema + cabinetmaking pitfalls (mirror, carcass math, wrong face…). Scope after --"
    cmds:
      - '{{.PY}} -m meble validate {{.CLI_ARGS | default "--apartment bohaterow"}}'
      - '{{.PY}} -m meble review {{.CLI_ARGS | default "--apartment bohaterow"}}'

  test:
    desc: "Run the test suite — locks the export behaviour a wrong order would cost real money to discover"
    cmds: ['{{.PY}} -m pytest -q {{.CLI_ARGS}}']

  csv:
    desc: "Export the meble.pl CSV (one per board) and open the folder. Scope after --"
    cmds:
      - '{{.PY}} -m meble csv {{.CLI_ARGS | default "--set kitchen"}}'
      - "open out/csv"

  pdf:
    desc: "Export per-panel PDF spec sheets and open it. Scope after --"
    cmds:
      - '{{.PY}} -m meble pdf {{.CLI_ARGS | default "--set kitchen"}} --out out/panels.pdf'
      - "open out/panels.pdf"

  hardware:
    desc: "What to BUY — confirmats, hinges (by overlay), pins, slides — and a printable PDF. Scope after --"
    cmds:
      - '{{.PY}} -m meble hardware {{.CLI_ARGS | default "--apartment bohaterow"}}'

  view:
    desc: "Open the interactive 3D viewer in the browser (orbit/zoom/pan, presets, exploded, isolate). Scope after --"
    cmds:
      - '{{.PY}} -m meble view {{.CLI_ARGS | default "--set kitchen"}}'
