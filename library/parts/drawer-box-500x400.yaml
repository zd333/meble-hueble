# Reusable sub-assembly: a confirmat drawer box, ~500 deep for a ~600-wide cabinet (box outer 400 here).
# Same shape as a cabinet (panels + assembly). Referenced by cabinet.parts[]; panels flow into the list
# ×quantity. SAMPLE — adjust width to the actual opening (ball-bearing box width = internal − 25.4).
id: drawer-box-500x400
name: "Szuflada 500×400 (konfirmat)"
type: drawer-box
defaults: { material: w980-18, edgeband: eb-w980-1 }

panels:
  - id: bok-szuflady
    name: "Bok szuflady"
    role: side
    width: 500            # depth
    height: 150
    quantity: 2
    grain: width
    edge_banding: { edges: { 1: eb-w980-1 }, glue_type: long }   # band the top edge

  - id: front-tyl-wewn
    name: "Front/tył wewnętrzny"
    role: divider
    width: 364            # 400 outer − 2×18 (between sides)
    height: 150
    quantity: 2
    grain: width
    edge_banding: { edges: { 1: eb-w980-1 }, glue_type: long }

  - id: dno-szuflady
    name: "Dno szuflady (HDF)"
    role: back
    material: hdf-3
    width: 364
    height: 468
    quantity: 1
    grain: any
    edge_banding: {}      # HDF bottom — no banding

assembly:
  fittings:
    - id: cf-fl
      hardware: confirmat-7x50
      through: bok-szuflady
      into: front-tyl-wewn
      seam: { through_edge: 4, into_edge: 2 }
      at: [40, 110]
    - id: cf-fr
      hardware: confirmat-7x50
      through: bok-szuflady
      into: front-tyl-wewn
      seam: { through_edge: 2, into_edge: 4 }
      at: [40, 110]
  hardware:
    - { ref: slide-bb-500, quantity: 1 }   # one pair of slides
