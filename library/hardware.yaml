# Fasteners / fittings + their DRILL PATTERNS. Referenced by id from cabinet.assembly.fittings[].hardware.
#
# ---------------------------------------------------------------------------------------------------
# `components:` and `sourcing:` — WHAT ONE FITTING IS MADE OF, AND HOW A SHOP SELLS IT
# ---------------------------------------------------------------------------------------------------
# One fitting is often several physical parts: a hinge is an arm+cup PLUS a mounting plate, a rafix is
# a housing PLUS a bolt. HOW THOSE MAP ONTO THINGS YOU CAN BUY IS A PROPERTY OF THE VENDOR, not of the
# fitting — Blum sells the hinge and the plate as two article numbers, while cheaper ranges sell
# "zawias z prowadnikiem" as one. So:
#
#   components:  the logical parts of ONE fitting. Order-independent, vendor-independent.
#   sourcing:    offerings. Each says which components it `covers:` — one for a single part, several
#                for a bundle. `variant:` narrows an offering to one variant (hinge overlay).
#
# `meble hardware` resolves them per vendor and REPORTS ANY COMPONENT NOTHING COVERS. That check is the
# point: 10 hinges with no mounting plates hangs exactly zero doors, and the shopping list is where
# that has to surface — not the assembly.
#
# /!\ PRICES ARE INDICATIVE AND DATED. `checked:` is when someone last looked. They are here to
#     budget with, never to quote: `meble pack` was deleted from this project precisely because a
#     local number that looked authoritative invited confident decisions that turned out wrong. SKU,
#     vendor and model are stable facts; the price beside them is a snapshot.
# `drill` is what `meble fit` stamps onto the joined panels. Numbers follow the supplier convention
# (see docs/cabinet-construction.md). Verify order-critical ones against the live editor.
hardware:
  - id: confirmat-7x50
    type: confirmat
    name: "Confirmat 7×50"
    drill:
      face: { dia: 8, countersink: true }   # Ø8 surface clearance, through the passing panel
      edge: { dia: 4, depth: 35 }           # Ø4 pilot into the end-grain of the mating panel
    end_margin: 50                          # keep first/last screw >= this from the panel end

  # NOT USED IN THIS PROJECT — kept as reference knowledge. Every cam joint here is `rafix-20`, which
  # does the same job in two holes instead of three (see below). Minifix is cheaper per unit but needs
  # the extra Ø8 edge channel, and drilling is charged per hole.
  - id: minifix-15
    type: minifix
    name: "Minifix cam 15 (pin 34+11)"
    drill:
      cam:   { dia: 15, depth: 13 }         # cam housing in the rail/shelf face
      dowel: { dia: 8, depth: 15 }          # alignment dowel beside the cam
      bolt:  { dia: 5 }                     # connecting-bolt hole in the side edge

  - id: rafix-20
    type: rafix
    name: "Rafix 20"
    # THE DEFAULT CAM FITTING HERE — used wherever a confirmat head would land on a face you can see.
    #
    # TWO HOLES, not three. That is the whole reason to prefer it over minifix: the Ø20 housing sits
    # only `axis_from_edge` from the panel edge, so the bore (r=10) BREAKS OUT at the edge by ~0.5 mm
    # and the bolt enters straight through that opening. Minifix needs a third bore — a Ø8 channel
    # drilled in from the edge to reach a cam sitting ~34 mm back. One less hole per joint means one
    # less line to type into the editor and one less hole to be charged for.
    #
    # /!\ VERIFY THESE THREE FIGURES against the rafix you actually buy before ordering drilling.
    #     `depth: 14` is deliberately the DEEP end of the range (12.5-14 depending on maker): a hole
    #     bored deeper than the housing needs still seats it, whereas one bored too shallow does not.
    #     The cost of that choice is the far-side wall — 18 − 14 = 4 mm — which only matters where the
    #     opposite face is on show. `axis_from_edge` is the order-critical one: too far from the edge
    #     and the bore never breaks out, so the bolt has nothing to enter through.
    axis_from_edge: 9.5                   # housing centre to the seam edge; Ø20 bore breaks out ~0.5
    drill:
      housing: { dia: 20, depth: 14 }     # in the FACE of the panel the bolt enters
      bolt:    { dia: 5, depth: 12 }      # in the FACE of the mating panel, on the seam centreline
    components:                           # usually two article numbers, sometimes sold as a set
      - { id: housing, name: "Ø20 housing (obudowa)" }
      - { id: bolt,    name: "connecting bolt (trzpień)" }
    sourcing: []                          # TODO look up SKUs; sold both loose and as sets

  - id: dowel-8x30
    type: dowel
    name: "Dowel Ø8×30"
    drill:
      face: { dia: 8, depth: 15 }
      edge: { dia: 8, depth: 15 }

  - id: shelf-pin-5
    type: shelf-pin
    name: "Shelf pin Ø5"
    # /!\ BUY THE COLLARED KIND wherever a pin goes into a `depth: through` bore. A gable with
    #     shelves on BOTH sides gets ONE through column pair, so two pins meet mid-panel at ~9 mm
    #     each — plenty, but only if each has a collar to stop against. A plain peg has nothing.
    #     `meble hardware` reports how many of the total land in through bores.
    drill:
      hole: { dia: 5, depth: 13 }           # on the 32 mm grid, 37 mm setback

  # ---- used once FRONTS / DRAWERS are added (defined now as ready knowledge) ----
  - id: hinge-clip-110
    type: hinge
    name: "Concealed hinge clip 110°"
    # /!\ THE OVERLAY IS A PURCHASING CHOICE, NOT A DRILLING ONE. The Ø35 cup and the 37 mm plate
    #     line below are IDENTICAL for all three; only the hinge you buy differs. It is decided by
    #     which panel the door lands on, so it is declared per fitting (`variant:`), and
    #     `meble review` cross-checks it against that panel's role. Figures: cabinet-construction.md.
    variants:
      full:  { name: "full overlay (nakładany prosty)", crank: 0,
               use: "the door covers a whole side panel" }
      half:  { name: "half overlay (półnakładany)",     crank: 9.5,
               use: "two doors share one divider/gable, each covering ~half of it" }
      inset: { name: "inset (wpuszczany)",              crank: 16.5,
               use: "the door sits flush inside the carcass" }
    drill:
      cup:   { dia: 35, depth: 12, boring: 5 }   # on the door (front)
      plate: { pattern: system32, screws: 2 }    # on the cabinet side, 37 mm setback
    components:
      - { id: hinge, name: "arm + Ø35 cup", per_variant: true }
      - { id: plate, name: "mounting plate (prowadnik)" }
    # Blum sells these as TWO article numbers. The plate fits all three overlays, so only the hinge
    # is variant-specific. Buying hinges without plates hangs no doors at all.
    sourcing:
      - vendor: centrum.meble.pl
        covers: [hinge]
        variant: full
        sku: 71T3550
        name: "Blum CLIP top 110° nakładany, ze sprężyną, puszka na wkręty"
        price: 5.71
        checked: 2026-08-18
      - vendor: centrum.meble.pl
        covers: [hinge]
        variant: half
        sku: 71T3650
        name: "Blum CLIP top 110° bliźniaczy, ze sprężyną, puszka na wkręty"
        price: 7.37
        checked: 2026-08-18
        note: "meble.pl files half overlay under `drzwi bliźniacze` (twin doors)"
      - vendor: centrum.meble.pl
        covers: [plate]
        sku: 173L6100
        name: "Blum prowadnik krzyżakowy CLIP, dyst. 0 mm, regul. wysokości, bez Euro"
        price: 0.76
        checked: 2026-08-18
        note: "fits nakładane / bliźniacze / wpuszczane alike; h=0 unless you want to trim the gap"
      - vendor: centrum.meble.pl
        covers: [hinge]
        variant: full
        sku: 71B3550
        name: "Blum CLIP top BLUMOTION 110° nakładany (soft-close)"
        price: 11.35
        checked: 2026-08-18
        note: "alternative to 71T3550 + damper; same cup and same drilling"

  - id: slide-bb-350
    type: slide
    name: "Ball-bearing slide 350 (full extension)"
    sold_as: pair                                 # left + right; `quantity: 1` on a fitting = 1 pair
    length: 350
    side_clearance: 12.7                          # per side -> drawer box width = internal - 25.4
    # `pattern: system32` is SYMBOLIC — nothing expands it into holes, and we do not want it to:
    # slides are mounted on site, so their fittings carry `drilling: none`.
    drill:
      cabinet: { pattern: system32, front_setback: 37 }
      drawer:  { pattern: system32 }

  - id: slide-bb-500
    type: slide
    name: "Ball-bearing slide 500 (full extension)"
    sold_as: pair                                 # left + right; `quantity: 1` on a fitting = 1 pair
    length: 500
    side_clearance: 12.7                          # per side -> drawer box width = internal - 25.4
    # `pattern: system32` is SYMBOLIC — nothing expands it into holes, and we do not want it to:
    # slides are mounted on site, so their fittings carry `drilling: none`.
    drill:
      cabinet: { pattern: system32, front_setback: 37 }
      drawer:  { pattern: system32 }
