# Worked example: a simple 600-wide base cabinet, carcass-only, confirmat construction.
# Sides + top/bottom + HDF back + one adjustable shelf. (Fronts/drawers come in a later iteration.)
#
# Drilling workflow: the shelf-pin holes below are MANUAL (no `src`). The confirmat holes are stamped by
# `python -m meble fit --cabinet d60-base`, which writes them into each panel tagged with `src`.
id: d60-base
name: "Szafka dolna 600"
kind: custom
category: base
construction: confirmat
dimensions: {width: 600, height: 720, depth: 560}
position: {x: 0, y: 0, z: 0, rotation: 0}
defaults: {material: w980-18, edgeband: eb-w980-1}
back: {type: surface}
plinth: {height: 100}

panels:
- id: bok-l
  name: "Bok lewy"
  element_type: panel
  role: side-left
  width: 560              # depth (X = front-to-back)
  height: 720             # vertical
  edge_banding: {edges: {2: eb-w980-1}, glue_type: long}         # front edge banded
  holes:
  - {face: front, x: 523, y: 350, dia: 5, depth: 13, type: single}
  - {face: front, x: 107, y: 350, dia: 5, depth: 13, type: single}
  - face: back
    x: 50
    y: 9.0
    dia: 8
    depth: through
    type: single
    src: cf-bot-l
  - face: back
    x: 280
    y: 9.0
    dia: 8
    depth: through
    type: single
    src: cf-bot-l
  - face: back
    x: 510
    y: 9.0
    dia: 8
    depth: through
    type: single
    src: cf-bot-l
  - face: back
    x: 50
    y: 711.0
    dia: 8
    depth: through
    type: single
    src: cf-top-l
  - face: back
    x: 280
    y: 711.0
    dia: 8
    depth: through
    type: single
    src: cf-top-l
  - face: back
    x: 510
    y: 711.0
    dia: 8
    depth: through
    type: single
    src: cf-top-l
- id: bok-r
  name: "Bok prawy"
  element_type: panel
  role: side-right
  width: 560
  height: 720
  edge_banding: {edges: {2: eb-w980-1}, glue_type: long}
  holes:
  - {face: front, x: 523, y: 350, dia: 5, depth: 13, type: single}
  - {face: front, x: 107, y: 350, dia: 5, depth: 13, type: single}
  - face: back
    x: 50
    y: 9.0
    dia: 8
    depth: through
    type: single
    src: cf-bot-r
  - face: back
    x: 280
    y: 9.0
    dia: 8
    depth: through
    type: single
    src: cf-bot-r
  - face: back
    x: 510
    y: 9.0
    dia: 8
    depth: through
    type: single
    src: cf-bot-r
  - face: back
    x: 50
    y: 711.0
    dia: 8
    depth: through
    type: single
    src: cf-top-r
  - face: back
    x: 280
    y: 711.0
    dia: 8
    depth: through
    type: single
    src: cf-top-r
  - face: back
    x: 510
    y: 711.0
    dia: 8
    depth: through
    type: single
    src: cf-top-r
- id: wieniec-dolny
  name: "Wieniec dolny"
  element_type: panel
  role: bottom
  width: 564              # 600 − 2×18
  height: 560             # depth
  edge_banding: {edges: {1: eb-w980-1}, glue_type: long}         # front edge banded

  holes:
  - face: edge4
    from: 50
    dia: 4
    depth: 35
    type: single
    src: cf-bot-l
  - face: edge4
    from: 280
    dia: 4
    depth: 35
    type: single
    src: cf-bot-l
  - face: edge4
    from: 510
    dia: 4
    depth: 35
    type: single
    src: cf-bot-l
  - face: edge2
    from: 50
    dia: 4
    depth: 35
    type: single
    src: cf-bot-r
  - face: edge2
    from: 280
    dia: 4
    depth: 35
    type: single
    src: cf-bot-r
  - face: edge2
    from: 510
    dia: 4
    depth: 35
    type: single
    src: cf-bot-r
- id: wieniec-gorny
  name: "Wieniec górny"
  element_type: panel
  role: top
  width: 564
  height: 560
  edge_banding: {edges: {1: eb-w980-1}, glue_type: long}
  holes:
  - face: edge4
    from: 50
    dia: 4
    depth: 35
    type: single
    src: cf-top-l
  - face: edge4
    from: 280
    dia: 4
    depth: 35
    type: single
    src: cf-top-l
  - face: edge4
    from: 510
    dia: 4
    depth: 35
    type: single
    src: cf-top-l
  - face: edge2
    from: 50
    dia: 4
    depth: 35
    type: single
    src: cf-top-r
  - face: edge2
    from: 280
    dia: 4
    depth: 35
    type: single
    src: cf-top-r
  - face: edge2
    from: 510
    dia: 4
    depth: 35
    type: single
    src: cf-top-r
- id: polka
  name: "Półka"
  element_type: panel
  role: shelf
  width: 564
  height: 540             # a bit shallower than carcass for clearance
  edge_banding: {edges: {1: eb-w980-1}, glue_type: long}
  holes: []

- id: plecy
  name: "Plecy HDF"
  element_type: panel
  role: back
  material: hdf-3
  width: 600
  height: 720
  grain: any
  edge_banding: {}        # HDF back, surface-mounted — no banding

  holes: []
assembly:
  fittings:
  - {id: cf-bot-l, hardware: confirmat-7x50, through: bok-l, into: wieniec-dolny, seam: {through_edge: 3, into_edge: 4}, at: [50, 280, 510]}
  - {id: cf-bot-r, hardware: confirmat-7x50, through: bok-r, into: wieniec-dolny, seam: {through_edge: 3, into_edge: 2}, at: [50, 280, 510]}
  - {id: cf-top-l, hardware: confirmat-7x50, through: bok-l, into: wieniec-gorny, seam: {through_edge: 1, into_edge: 4}, at: [50, 280, 510]}
  - {id: cf-top-r, hardware: confirmat-7x50, through: bok-r, into: wieniec-gorny, seam: {through_edge: 1, into_edge: 2}, at: [50, 280, 510]}

parts: []
