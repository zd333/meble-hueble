# =====================================================================================================
# KITCHEN OPEN UNIT — 900 W × 400 H × 600 D, carcass only, no fronts
# =====================================================================================================
#
# The only custom cabinet in the kitchen. Everything else in the room is standard IKEA and is handled
# outside this project.
#
# WHAT IT IS
#   A plain box: two sides, a top, a bottom, and nothing on the front — no doors, no drawers, no
#   facade of any kind. The back is open too; three stretchers replace the back panel.
#
# THE DECOR IS NOT A FREE CHOICE — IT MATCHES THE IKEA CARCASSES (revised 2026-08-12)
#   This unit sits open in a run of ready-made IKEA METOD boxes, so its front edges AND its whole inner
#   cavity are read side by side with a METOD carcass at eye level. It therefore rides `u899-18`
#   (Egger Czerń aksamitna U899 ST9), the NCS S 8500-N match for METOD's dark "czarnoszary" carcass —
#   NOT the bathroom's u604-18 and no longer the white w1100-18 this unit was designed against.
#   See library/materials.yaml for the match and its one caveat (U899 runs slightly warm).
#   NB this compounds with the all-round banding below: on a near-black board a raw chipboard edge is
#   a pale line, far more obvious than it was on white. The "no raw edge anywhere" call now earns its
#   keep on appearance, not just on chip protection.
#
# THIS CABINET HOUSES THE AIR-CONDITIONING INDOOR UNIT
#   A standard ~12 000 BTU wall-mounted split indoor unit lives inside this box. That is what the two
#   VERTICAL stretchers are for: they are the mounting rails its wall plate screws onto. The unit is
#   NOT ordered here and appears nowhere in the panel list — the only thing the design owes it is a
#   pair of rails in a believable place, so the 3D view can be shown to the installer preparing the
#   pipe, drain and power runs.
#
# THE THREE STRETCHERS — ALL THREE ARE UNDRILLED
#   - `rail-back-h`  864 × 150, HORIZONTAL, in the back plane (y 582..600) against the wall, filling the
#     top of the back opening (z 232..382).
#   - `rail-back-v` ×2  100 × 364, VERTICAL, full internal height, standing WELL FORWARD of the back at
#     y 250..268 — see AC UNIT GEOMETRY below. They used to sit at y 564..582, just in front of the
#     horizontal; that was fine as joinery but drew the unit hard against the back wall, which is not
#     where it goes and would have misled anyone reading the picture.
#   NONE of them carries a single hole or fitting. Every position here is decided during assembly —
#   the verticals' x, and the wall fixings in the horizontal. Screw the verticals down through the top
#   panel and up through the bottom panel, and the horizontal through the sides.
#   The carcass does NOT depend on them for squareness: the full 600-deep top and bottom panels, each
#   with 3 confirmats per side, already fix the box.
#   /!\ ONLY THE HORIZONTAL CAN HANG THE UNIT ON THE WALL now. It is the one still in the back plane;
#       the verticals no longer reach the wall, so put every wall fixing in `rail-back-h`.
#   /!\ THE VERTICALS NOW CARRY A HANGING LOAD (~10-12 kg of indoor unit, pulling forward and down).
#       A screw driven into the END GRAIN of 18 mm MFC is the weakest joint in the book. Use confirmats
#       top and bottom, not plain chipboard screws, and put two per end.
#   The z positions above (and the verticals' x 150/650 below) are INDICATIVE, for the 3D preview only.
#
# AC UNIT GEOMETRY — where the y 250 came from
#   Typical 12 000 BTU indoor unit: ~800 wide × 190-230 deep × 285-300 tall. It fits the 864 × 364
#   internal envelope with room to spare.
#     mounting face (verticals' front face)         y = 250
#     less wall-plate + hanging-hook standoff       −15   -> unit's back casing at y ~235
#     less unit depth 190-230                       ->     unit's FRONT face lands at y 5..45
#   i.e. the unit finishes just behind the cabinet front for any unit in that range, never proud of it,
#   which is what "close to the front" has to mean if the doors of the run are to shut past it.
#   ONE NUMBER TO CHANGE: if the real unit's depth is known, set the verticals' `pos` y to
#   (unit depth + 15 + however far you want it recessed) and nothing else moves.
#   /!\ AIRFLOW, not checked by any tool here: these units breathe IN through the top grille and blow
#       OUT downward-forward. A 290-tall unit in a 364 internal leaves ~74 mm above it — tight against
#       the ~100 mm most makers ask for. The box is open front AND back, so air can reach it, but
#       confirm the clearance against the actual model's manual before the carcass is cut.
#
# ALL SIDES ARE INVISIBLE -> CONFIRMAT THROUGHOUT
#   No cam fittings anywhere. Every head lands on a side's outer face, the top's up face or the bottom's
#   underside, and none of those is ever seen.
#
# BANDING — EVERY EXPOSED EDGE, front and back (revised 2026-08-10)
#   There is no facade, so the carcass's own front edges ARE the finished front: side-l edge 2, side-r
#   edge 4, top and bottom edge 1.
#   THE SIDES ARE BANDED ALL ROUND, and two of those edges are a correction rather than a preference:
#   the top and bottom panels sit BETWEEN the sides, so each side's edge1 and edge3 form the outer
#   18 mm of the unit's own top and bottom surfaces. They are on show on an open unit with no plinth
#   and no worktop over it, and an earlier revision left them raw by mis-stating them as hidden.
#   THE REAR EDGES ARE BANDED BY CHOICE — the sides' rear edge and the top and bottom panels' edge3.
#   They face the wall and are effectively invisible, so this buys no appearance; it is a deliberate
#   "no raw chipboard anywhere" call. It also means no exposed core to chip while the unit is carried
#   or slid into place. Roughly doubles the banding on this cabinet, ~4.9 m to ~9.8 m of 1 mm tape.
#   STILL RAW, on purpose: every BUTTED edge — the top and bottom panels' ends (edges 2/4), the
#   stretchers' ends, the horizontal stretcher's top edge. Those are glued screw joints, and band
#   inside a joint is a weaker joint, not a tidier one. Band goes on faces you can see or touch.
#
# COUPLED DIMENSIONS — change one, re-derive the rest
#   W = 900   internal = 900 − 36 = 864   -> top, bottom and the horizontal stretcher all span 864
#   D = 600   side width. Cabinet frame: y 0 = FRONT, y 600 = the wall.
#             back plane y 582..600 (horizontal stretcher); AC mounting rails y 250..268 (verticals),
#             leaving y 268..582 clear behind them for the pipe, drain and power runs
#   H = 400   side height; top and bottom are 18 each -> internal height 364 (z 18..382)
#             horizontal stretcher z 232..382 = the top 150 of the back opening
#             vertical stretchers  z  18..382 = the full internal height
#
# EXPECTED `meble review` WARNING — not a bug
#   - `mirror-pair`  both sides are now banded all round, so their vertical-edge sets match and the
#     linter can no longer see the mirroring. They ARE a genuine mirror pair: side-l's front is edge2
#     and side-r's is edge4, and their confirmat columns are at opposite ends. Banding every edge is
#     what silenced the evidence, not a mistake. Same warning, same reason, on sink-vanity.
#
# EVERY HOLE IN THIS FILE IS STAMPED BY `meble fit`
#   There is nothing hand-written, so the whole cabinet follows a resize cleanly — change a dimension,
#   re-run `fit`, done. (The bathroom units are not like this; see their headers.)
# =====================================================================================================

id: open-900
name: "Kitchen open unit 900"
kind: custom
category: base
construction: confirmat      # ALL of it — see ALL SIDES ARE INVISIBLE above
dimensions: {width: 900, height: 400, depth: 600}
position: {x: 0, y: 0, z: 0, rotation: 0}
defaults: {material: u899-18, edgeband: eb-u899-1}
back: {type: surface}        # /!\ ORDER-IRRELEVANT METADATA and inaccurate: there is NO back panel,
                             # only the three stretchers. The schema has no value for that; the panel
                             # geometry below is what counts.
plinth: {}                   # no plinth — the sides run to whatever this stands on

panels:

- id: side-l
  name: "Left side"
  element_type: panel
  role: side-left             # outer faces left; edge2 = cabinet FRONT, edge4 = wall.
                              # X: 0 = wall, 600 = front.  Y: 0 = bottom, 400 = top.
  width: 600                  # depth
  height: 400
  grain: any                  # U899 is a plain uni decor — no printed grain to line up — let the optimiser
                              # rotate every panel in this cabinet
  edge_banding: {all_edges: true, band: eb-u899-1, glue_type: long}
                              # ALL FOUR. edge2 is the finished front (there is no facade). edge1 and
                              # edge3 are NOT hidden either: the top and bottom panels sit BETWEEN the
                              # sides, so these two edges are the outer 18 mm of the unit's own top and
                              # bottom surfaces. edge4 (rear) is banded by choice — see BANDING.
  holes:                      # stamped by cf-bot-l / cf-top-l — nothing for the back stretchers,
                              # which are fixed on site (see their panel notes)
  - face: outer
    x: 50
    y: 9.0
    dia: 8
    depth: through
    type: multi
    count: 3
    spacing: 250
    direction: x
    src: cf-bot-l
  - face: outer
    x: 50
    y: 391.0
    dia: 8
    depth: through
    type: multi
    count: 3
    spacing: 250
    direction: x
    src: cf-top-l
- id: side-r
  name: "Right side"
  element_type: panel
  role: side-right            # MIRROR of side-l. X: 0 = FRONT, 600 = wall — so edge4 (not edge2) is the
                              # cabinet front, and the stretcher's through-holes read x 591 not x 9.
  width: 600
  height: 400
  grain: any
  edge_banding: {all_edges: true, band: eb-u899-1, glue_type: long}
                              # ALL FOUR, as side-l — here edge4 is the front and edge2 the rear.
  holes:                      # stamped by cf-bot-r / cf-top-r — nothing for the back stretchers
  - face: outer
    x: 50
    y: 9.0
    dia: 8
    depth: through
    type: multi
    count: 3
    spacing: 250
    direction: x
    src: cf-bot-r
  - face: outer
    x: 50
    y: 391.0
    dia: 8
    depth: through
    type: multi
    count: 3
    spacing: 250
    direction: x
    src: cf-top-r
- id: bottom
  name: "Bottom panel"
  element_type: panel
  role: bottom                # 864 = 900 − 2×18. edge1 = cabinet FRONT (y 600), edge3 = wall (y 0).
                              # inner = UP, outer = DOWN (docs/conventions.md "Horizontals: which face
                              # is up").
  width: 864
  height: 600                 # depth
  grain: any
  edge_banding: {edges: {1: eb-u899-1, 3: eb-u899-1}, glue_type: long}
                              # edge1 = the finished front. edge3 = the rear edge, banded by choice
                              # (see BANDING). Edges 2/4 butt the sides and carry this panel's confirmat
                              # pilots — they stay RAW: band does not belong inside a glued screw joint.
  holes:                      # stamped by cf-bot-l / cf-bot-r
  - face: edge4
    from: 50
    dia: 4
    depth: 35
    type: multi
    count: 3
    spacing: 250
    src: cf-bot-l
  - face: edge2
    from: 50
    dia: 4
    depth: 35
    type: multi
    count: 3
    spacing: 250
    src: cf-bot-r
  placement: {pos: [18, 0, 0]}

- id: top
  name: "Top panel"
  element_type: panel
  role: top                   # 864 = 900 − 2×18. NB on a `top` panel OUTER is the DOWN face and INNER
                              # the UP face — see docs/conventions.md.
  width: 864
  height: 600
  grain: any
  edge_banding: {edges: {1: eb-u899-1, 3: eb-u899-1}, glue_type: long}
                              # edge1 = the finished front, edge3 = the rear edge. Edges 2/4 butt the
                              # sides and carry the confirmat pilots — RAW, as on the bottom panel.
  holes:                      # stamped by cf-top-l / cf-top-r
  - face: edge4
    from: 50
    dia: 4
    depth: 35
    type: multi
    count: 3
    spacing: 250
    src: cf-top-l
  - face: edge2
    from: 50
    dia: 4
    depth: 35
    type: multi
    count: 3
    spacing: 250
    src: cf-top-r
  placement: {pos: [18, 0, 382]}

- id: rail-back-h
  name: "Back stretcher (horizontal)"
  element_type: panel
  role: rail                  # fills the TOP of the back opening, z 232..382, in the back plane
                              # y 582..600 so it sits flat against the wall. Frame declared like a
                              # `back`: OUTER faces the WALL, so local +x runs cabinet RIGHT-to-LEFT —
                              # its edge2 meets side-l and edge4 meets side-r.
                              # Local y 0 = its own bottom edge = cabinet z 232.
                              # This is the panel that ties the two sides together at the back and the
                              # obvious place to put the wall fixings.
  width: 864                  # 900 − 2×18
  height: 150
  grain: any
  edge_banding: {edges: {3: eb-u899-1}, glue_type: long}
                              # BOTTOM edge only: it is the one edge you can see through the open front.
                              # Its top edge butts the top panel's underside, and its two ends butt the
                              # sides.
  holes: []                   # DELIBERATELY EMPTY, like the two verticals — fixed on site.
  placement: {pos: [18, 582, 232], rot: [90, 0, 180]}
    # rot is REQUIRED: `rail` is not in the viewer's ROLE_FRAME table (tools/meble/scene.py), so without
    # it the panel falls back to the identity frame and lies flat on the floor. [90, 0, 180] reproduces
    # the `back` frame: +u = cabinet LEFT, +v = UP, outer toward the wall.

- id: rail-back-v
  name: "Back stretcher (vertical)"
  element_type: panel
  role: rail                  # full internal height, z 18..382, standing at y 250..268 — the MOUNTING
                              # RAILS for the air-conditioning indoor unit, not back stretchers any
                              # more. They are clear of the horizontal (y 582..600) by 314 mm, so the
                              # two no longer touch and each vertical still slides anywhere along the
                              # width. See AC UNIT GEOMETRY in the header for where 250 comes from.
  quantity: 2
  width: 100
  height: 364                 # 400 − 2×18, floor of the box to ceiling of the box
  grain: any
  edge_banding: {edges: {2: eb-u899-1, 4: eb-u899-1}, glue_type: long}
                              # both LONG (vertical) edges — they face sideways into the open box and are
                              # seen through the front. Top and bottom edges butt the top/bottom panels.
  holes: []                   # DELIBERATELY EMPTY, and still correct now that these mount the AC unit:
                              # the wall plate's screw pattern varies by model and the rails' x is set
                              # on site, so nothing can be drilled in advance. Screw them down through
                              # the top panel and up through the bottom panel once positioned — with
                              # confirmats, see the load warning in the header — then screw the AC wall
                              # plate to their FRONT faces (y 250).
  placement: {pos: [150, 250, 18], step: [500, 0, 0], rot: [90, 0, 180]}
    # y 250 = the AC mounting face; the unit hangs off this plane forward toward the open front.
    # x 150 and 650 -> the rails occupy x 150..250 and 650..750, centres 200 and 700, 500 mm apart and
    # symmetric about the cabinet centre 450 (132 mm clear to the internal face at each side).
    # WHY THIS WIDE. They were at 300/500 — centres only 200 apart, both sitting in the middle third of
    # an ~800 mm wall plate. That supports the plate at its centre and lets both ends cantilever, which
    # is the wrong way round: the load an indoor unit puts on its plate is a forward TIPPING moment, and
    # the further apart the fixings, the less it can rock. It is also not where plates are drilled.
    # WHY NOT WIDER. The rails must stay under the plate for every unit in the 12k class, and those run
    # 722-845 mm wide. At the narrow end a 722 plate centred in the box spans x 89..811 — these rails
    # (150..250, 650..750) are still comfortably inside it. Pushing them further out would miss it.
    # BONUS: x 250..650 between the rails is now completely clear, which is where the refrigerant pipes
    # and the condensate drain leave the back of the unit. Do not fill that gap.
    # Still INDICATIVE — set to the actual plate's fixing holes once the model is known. The panels do
    # not change, only where they land.
    # rot reproduces the `back` frame, same as the horizontal stretcher.

assembly:
  fittings:

  # --- sides <-> bottom and top. `at` is measured from the WALL along the 600 mm depth and is SYMMETRIC
  #     about the 300 mid-depth. That symmetry is load-bearing, not cosmetic: side-l's local x runs from
  #     the wall but side-r's runs from the FRONT, so only a symmetric set lands on the same physical
  #     points read from both frames. All four are clean perimeter butt joints -> `fit` stamps them.
  - {id: cf-bot-l, hardware: confirmat-7x50, through: side-l, into: bottom, seam: {through_edge: 3, into_edge: 4}, at: [50, 300, 550]}
  - {id: cf-bot-r, hardware: confirmat-7x50, through: side-r, into: bottom, seam: {through_edge: 3, into_edge: 2}, at: [50, 300, 550]}
  - {id: cf-top-l, hardware: confirmat-7x50, through: side-l, into: top, seam: {through_edge: 1, into_edge: 4}, at: [50, 300, 550]}
  - {id: cf-top-r, hardware: confirmat-7x50, through: side-r, into: top, seam: {through_edge: 1, into_edge: 2}, at: [50, 300, 550]}

  # --- NONE of the three back stretchers has a fitting. All of them are positioned and drilled on site,
  #     so there is nothing to machine in advance. The box does not need them to be square: the full
  #     600-deep top and bottom panels, each with 3 confirmats per side, already fix the carcass.

parts: []
