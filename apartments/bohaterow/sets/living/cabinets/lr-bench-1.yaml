# ===================================================================================================
# lr-bench-1 — window bench, unit 1 of 2
#
# Living room, layout F2 (approved 2026-10-21). Board: Egger U750 ST9 Szary Taupe (u750-18).
# GENERATED once from the PRELIMINARY measurements by a scaffold script (gen_living.py); edit freely.
# /!\ Re-derive every number after the final on-site measurements — hand-written holes do not follow
#     a resize. Stamped confirmats (`drilling: stamped`) are restamped by `meble fit --set living`.
# World frame: origin = inner corner (window wall × left wall); x along the window wall, y negative
# into the room, z up. Plinth 80 (adjustable legs + clip-on board, see lr-plinth).
#
# Bench 350 deep in total: doors y −350..−332, carcass −332..−23, HDF −23..−20. It stands 20 mm OFF the
# wall because its top (z 472..490) would otherwise hit the sill nose (20 thick, 20 proud, top at 490).
# The seat itself is lr-bench-top, laid over this carcass AND the sill (seat surface 508).
# Two units of 1420 so no panel passes meble.pl's 2500 mm drilling limit; a gable at mid-span carries
# the seat. Doors: soft-close, NOT push-open (heels would pop them) — open them by the bottom edge over
# the recessed plinth.
# ===================================================================================================

