# ===================================================================================================
# lr-tower — corner column at the window, 350 × 300, z 80..2390
#
# Living room, layout F2 (approved 2026-10-21). Board: Egger U750 ST9 Szary Taupe (u750-18).
# GENERATED once from the PRELIMINARY measurements by a scaffold script (gen_living.py); edit freely.
# /!\ Re-derive every number after the final on-site measurements — hand-written holes do not follow
#     a resize. Stamped confirmats (`drilling: stamped`) are restamped by `meble fit --set living`.
# World frame: origin = inner corner (window wall × left wall); x along the window wall, y negative
# into the room, z up. Plinth 80 (adjustable legs + clip-on board, see lr-plinth).
#
# Turned onto the left wall (rotation 90): local x 0 = the side toward the vitrine (world y −350),
# x 350 = against the CONCRETE window wall (world y 0) — screw it to the concrete through side-r.
# Rows: 80..490 HIDING PLACE (closed by the bench end in front and the vitrine beside it) under a LOOSE
# lift-out shelf on 4 pins, with a loose insert on it so the niche floor is level with the seat
# (508); 508..1250 two rows of books (fixed shelf at 870); 1250..2390 Topal glass
# doors 756 + 376, hinged on the VITRINE side so they never swing over someone sitting on the bench.
# Every fixed shelf on rafix-20 (spans 314 — no sag).
# ===================================================================================================

