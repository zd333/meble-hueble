# ===================================================================================================
# lr-line — low line, 1800 × 300, z 80..1250 (+ oak top to 1272)
#
# Living room, layout F2 (approved 2026-10-21). Board: Egger U750 ST9 Szary Taupe (u750-18).
# GENERATED once from the PRELIMINARY measurements by a scaffold script (gen_living.py); edit freely.
# /!\ Re-derive every number after the final on-site measurements — hand-written holes do not follow
#     a resize. Stamped confirmats (`drilling: stamped`) are restamped by `meble fit --set living`.
# World frame: origin = inner corner (window wall × left wall); x along the window wall, y negative
# into the room, z up. Plinth 80 (adjustable legs + clip-on board, see lr-plinth).
#
# World y −3050..−1250: it ends 350 mm before the outer corner (crooked corner + the socket ~200 from
# it stays free). Three 600 bays on two gables; rows 80..490 and 490..870 U750 doors, 870..1250 IKEA
# HEDEVIKEN oak doors (bought, element_type front). IKEA BESTÅ 180×42 oak top ripped to 320 (bought,
# element_type countertop). Shelves at 490 and 870 in every bay, on rafix; bay 2 uses a different rafix
# spacing (80/217 vs 50/247) so the bolts on the two faces of a gable never meet inside it.
# /!\ TODO: the IKEA oak doors' hinge positions are not published — measure one door, then add their
#     hinge fittings and plate holes (row 870..1250).
# ===================================================================================================

