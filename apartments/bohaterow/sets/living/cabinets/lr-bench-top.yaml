# ===================================================================================================
# lr-bench-top — the seat: 3 pieces over the bench carcasses and the window sill
#
# Living room, layout F2 (approved 2026-10-21). Board: Egger U750 ST9 Szary Taupe (u750-18).
# GENERATED once from the PRELIMINARY measurements by a scaffold script (gen_living.py); edit freely.
# /!\ Re-derive every number after the final on-site measurements — hand-written holes do not follow
#     a resize. Stamped confirmats (`drilling: stamped`) are restamped by `meble fit --set living`.
# World frame: origin = inner corner (window wall × left wall); x along the window wall, y negative
# into the room, z up. Plinth 80 (adjustable legs + clip-on board, see lr-plinth).
#
# Middle piece = the window opening (x 490..2950) and runs from the bench front (y −350) back to the
# window frame (y +130): it lies ON the stone sill, so the seat is one surface at 508. ALL four edges
# banded 2 mm — condensation off the window in winter; leave 2–3 mm to the frame and seal with clear
# silicone. The side pieces are bench depth (350): left x 300..490 (tower front → window edge), right
# x 2950..3140 (window edge → 10 mm before the radiator). Their joint edges are banded too, so the joints
# read as two clean lines in line with the window reveal. Fixed from below through the carcass tops
# (on site, no supplier drilling).
# ===================================================================================================

id: lr-bench-top
name: "Living — bench top (3 pieces)"
kind: custom
category: base
construction: confirmat
dimensions: {width: 2840, height: 18, depth: 480}
position: {x: 0, y: 0, z: 0, rotation: 0}
defaults: {material: u750-18, edgeband: eb-u750-1}
back: {type: surface}
plinth: {}

panels:

- id: seat-l
  name: "Seat, left piece"
  element_type: panel
  role: seat
  width: 190
  height: 350
  grain: any
  edge_banding: {edges: {2: eb-u750-2, 3: eb-u750-2, 4: eb-u750-2}, glue_type: long}
  holes: []
  placement: {pos: [300, -350, 490], rot: [0, 0, 0]}

- id: seat-mid
  name: "Seat, middle piece (over the sill)"
  element_type: panel
  role: seat
  width: 2460
  height: 480
  grain: any
  edge_banding: {all_edges: true, band: eb-u750-2, glue_type: long}
  holes: []
  placement: {pos: [490, -350, 490], rot: [0, 0, 0]}

- id: seat-r
  name: "Seat, right piece"
  element_type: panel
  role: seat
  width: 190
  height: 350
  grain: any
  edge_banding: {edges: {3: eb-u750-2, 4: eb-u750-2, 2: eb-u750-2}, glue_type: long}
  holes: []
  placement: {pos: [2950, -350, 490], rot: [0, 0, 0]}

assembly:
  fittings:

parts: []
