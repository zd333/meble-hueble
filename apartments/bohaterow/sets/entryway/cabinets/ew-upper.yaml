# ===================================================================================================
# ew-upper — upper box on the corner base (niche, inner door, tech bay)
#
# Entryway hall wall, concept 6c (plan page https://claude.ai/artifact/JzMjC12Y9eRcLFYZqE7ifN).
# Board: Egger U750 ST9 Szary Taupe (u750-18), as the niche wardrobe. 2 mm band on what you see and touch.
# Hall ceiling 2530 (measured). Two things are ASSUMED: the bedroom door trim is at most 70 wide (the base
#     ends 70 before the opening), and nothing on the electric box door sticks out more than ~40 (the inner
#     door stands 80 off the wall). Stamped confirmats follow a resize (`meble fit --cabinet <id>`); every
#     other hole is hand-written and does NOT — re-derive them if a size moves.
# Joints: confirmat where the head is hidden (wall, neighbouring cabinet); rafix-20 on show faces.
# Set frame = ew-wardrobe's: x = 2550 − distance from the top wall, y = −(distance from the left wall).
# Stands on ew-base's full-width top (z 950..2450), its sides right over ew-base's side-l and gable,
# 2 dowels each (dw-base). Full 380 deep, flush with ew-base's top and doors. No bottom of its own: the ceiling and
# the dowels hold the sides square, and it is screwed to both walls on site.
# 950..1885 open niche; its back wall = the INNER DOOR, 80 off the wall in front of the electric box: 4 INSET
# hinges on side-l (plates 37 behind the door's back face = 40 from side-l's back edge — check the
# chosen hinge's drawing, the wall is close); no stop rail: the hinges hold it closed, barrel bolt at the free edge (on site).
# NOTHING in the box door's swing below 970: its bottom edge is not measured (1000 if the box is 880 tall),
# 30 margin kept. Base top 950 (+ glides ~10). Keys at 1250,
# bag + hat at 1700 (on site). 1885..1903 niche ceiling = floor of the TECH BAY, 5 over the box
# door's top edge (1880, measured). It stops 45 short of the wall: cables come up from the box (its door left
# a bit open) behind the inner door and through that gap, wide enough for a power plug. Tech bay 1903..2450 (router, mini server, home-automation
# hub, micro UPS; internals made on site): NO back
# and NO top — only an 80 top rail at the front, which keeps the sides square. The door 1885..2450 is FULL
# overlay over both sides: their front corners are notched 18 × 565 behind it, so in the niche the sides
# stay flush with the base top. It stops on the sides, the ceiling and the rail. Air: in around the inner door, up the 45 cable gap,
# out of the open top (80 to the ceiling, ~70 on the glides).
# All heights here are from the carcass bottom: the ~10 glides lift everything (box gap ~15 for real). 2 angle brackets to the wall.
# side-r is a show face: rafix there; ew-shelves' rafix bolts come into its OUTER face at 1441 and 1894
# (untagged holes, bought in ew-shelves).
# ===================================================================================================

id: ew-upper
name: "Entryway — upper box (niche + tech bay)"
kind: custom
category: wall
construction: confirmat
dimensions: {width: 560, height: 1500, depth: 380}
position: {x: 2550, y: -1160, z: 950, rotation: 180}
defaults: {material: u750-18, edgeband: eb-u750-1}
back: {type: surface}
plinth: {}

panels:

- id: side-l
  name: "Left side (top-wall end)"
  element_type: panel
  role: side-left
  width: 377
  height: 1500
  grain: any
  edge_banding: {edges: {2: eb-u750-2}, glue_type: long}
  notches: [{corner: top-right, width: 18, height: 565}]   # front-top corner, behind the tech bay door
  holes:
  - {face: outer, x: 92, y: 944, dia: 8, depth: through, type: multi, count: 3, spacing: 108.5, direction: x, src: cf-ceil-l}
  - {face: inner, x: 319.0, y: 1491, dia: 5, depth: 12, type: single, src: rf-trail-l}
  - {face: edge3, from: 80, dia: 8, depth: 15, type: multi, count: 2, spacing: 199, src: dw-base}
  - {face: inner, x: 40, y: 87.0, dia: 5, depth: 13, type: multi, count: 4, spacing: 243.0, direction: y, src: hg-inner}
  - {face: inner, x: 40, y: 119.0, dia: 5, depth: 13, type: multi, count: 4, spacing: 243.0, direction: y, src: hg-inner}
  placement: {pos: [0, 0, 0]}

- id: side-r
  name: "Right side"
  element_type: panel
  role: side-right
  width: 377
  height: 1500
  grain: any
  edge_banding: {edges: {4: eb-u750-2}, glue_type: long}
  notches: [{corner: top-left, width: 18, height: 565}]   # front-top corner, behind the tech bay door
  holes:
  - {face: inner, x: 58.0, y: 1491, dia: 5, depth: 12, type: single, src: rf-trail-r}
  - {face: inner, x: 68, y: 944, dia: 5, depth: 12, type: multi, count: 2, spacing: 200, direction: x, src: rf-ceil}
  - {face: edge3, from: 98, dia: 8, depth: 15, type: multi, count: 2, spacing: 199, src: dw-base}
  - {face: inner, x: 55, y: 1019, dia: 5, depth: 13, type: multi, count: 2, spacing: 365, direction: y, src: hg-door}
  - {face: inner, x: 55, y: 1051, dia: 5, depth: 13, type: multi, count: 2, spacing: 365, direction: y, src: hg-door}
  - {face: outer, x: 180, y: 491, dia: 5, depth: 12, type: multi, count: 2, spacing: 150, direction: x}   # ew-shelves rafix, shelf at 1432..1450
  - {face: outer, x: 180, y: 944, dia: 5, depth: 12, type: multi, count: 2, spacing: 150, direction: x}   # ew-shelves rafix, shelf at 1885..1903
  placement: {pos: [542, 0, 0]}

- id: ceiling
  name: "Niche ceiling / tech bay floor"
  element_type: panel
  role: divider   # underside 1885: 5 over the box door top (1880); back edge 45 off the wall = cable gap (a power plug passes); front edge hidden behind the tech bay door (stops it), so unbanded
  width: 524
  height: 317
  grain: any
  holes:
  - {face: edge4, from: 50, dia: 4, depth: 35, type: multi, count: 3, spacing: 108.5, src: cf-ceil-l}
  - {face: inner, x: 514.5, y: 67, dia: 20, depth: 14, type: multi, count: 2, spacing: 200, direction: y, src: rf-ceil}
  placement: {pos: [18, 18, 935]}

- id: top-rail
  name: "Top rail (front)"
  element_type: panel
  role: divider   # instead of a top: ties the sides, its front edge stops the router door; behind the door, so unbanded
  width: 524
  height: 80
  grain: any
  holes:
  - {face: outer, x: 9.5, y: 40.0, dia: 20, depth: 14, type: single, src: rf-trail-l}
  - {face: outer, x: 514.5, y: 40.0, dia: 20, depth: 14, type: single, src: rf-trail-r}
  placement: {pos: [18, 18, 1482]}

- id: inner-door
  name: "Inner door (hooks, box behind it)"
  element_type: panel
  role: front   # 953..1882, hinged on the corner side; keys at 1250, bag + hat at 1700
  width: 520
  height: 929
  grain: any
  edge_banding: {all_edges: true, band: eb-u750-2, glue_type: long}
  holes:
  - {face: inner, x: 22.5, y: 100.0, dia: 35, depth: 12, type: multi, count: 4, spacing: 243.0, direction: y, src: hg-inner}
  placement: {pos: [20, 282, 3]}

- id: door
  name: "Tech bay door"
  element_type: panel
  role: front   # 1885..2450, FULL overlay over both (notched) sides, hinged on the bedroom side; bottom edge level with the ceiling's underside and the open shelf
  width: 557
  height: 565
  grain: any
  edge_banding: {all_edges: true, band: eb-u750-2, glue_type: long}
  holes:
  - {face: inner, x: 534.5, y: 100, dia: 35, depth: 12, type: multi, count: 2, spacing: 365, direction: y, src: hg-door}
  placement: {pos: [1.5, 0, 935]}

assembly:
  fittings:
  - {id: cf-ceil-l, hardware: confirmat-7x50, drilling: manual, through: side-l, into: ceiling, at: [50, 158.5, 267]}
  - {id: rf-trail-l, hardware: rafix-20, drilling: manual, through: top-rail, into: side-l, at: [40]}
  - {id: rf-trail-r, hardware: rafix-20, drilling: manual, through: top-rail, into: side-r, at: [40]}
  - {id: rf-ceil, hardware: rafix-20, drilling: manual, through: ceiling, into: side-r, at: [68, 268]}
  - {id: dw-base, hardware: dowel-8x30, drilling: manual, quantity: 4, through: side-l, into: side-r}   # into ew-base's top, over its side-l and gable
  - {id: wall-br, hardware: angle-bracket-40, drilling: none, quantity: 2}   # router bay, to the right wall; + screws through side-l into the end wall (router bay, behind the inner door)
  - {id: hg-inner, hardware: hinge-clip-110, variant: inset, drilling: manual, door: inner-door, side: side-l, at: [103, 346, 589, 832]}
  - {id: hg-door, hardware: hinge-clip-110, variant: full, drilling: manual, door: door, side: side-r, at: [1035, 1400]}
