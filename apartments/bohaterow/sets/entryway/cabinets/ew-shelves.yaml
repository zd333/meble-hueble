# ===================================================================================================
# ew-shelves — open shelves over the low cabinet
#
# Entryway hall wall, concept 6c (plan page https://claude.ai/artifact/JzMjC12Y9eRcLFYZqE7ifN).
# Board: Egger U750 ST9 Szary Taupe (u750-18), as the niche wardrobe. 2 mm band on what you see and touch.
# Hall ceiling 2530 (measured). Two things are ASSUMED: the bedroom door trim is at most 70 wide (the base
#     ends 70 before the opening), and nothing on the electric box door sticks out more than ~40 (the inner
#     door stands 80 off the wall). Stamped confirmats follow a resize (`meble fit --cabinet <id>`); every
#     other hole is hand-written and does NOT — re-derive them if a size moves.
# Joints: confirmat where the head is hidden (wall, neighbouring cabinet); rafix-20 on show faces.
# Set frame = ew-wardrobe's: x = 2550 − distance from the top wall, y = −(distance from the left wall).
# Two open shelves over the low bay, 560..1080 along the right wall: 1432..1450 (daily hats, gloves) and
# 1885..1903, level with the tech bay floor (seasonal). Each: rafix-20 into ew-upper's side-r at the column end
# (housings underneath, bolts in that side's outer face) and 2 angle brackets under the back edge, screwed to the
# wall and to the shelf's underside (on site) — no screw head on top, no wall cleat.
# ===================================================================================================

id: ew-shelves
name: "Entryway — open shelves 1450 + 1903"
kind: custom
category: wall
construction: confirmat
dimensions: {width: 520, height: 471, depth: 250}
position: {x: 1990, y: -1290, z: 1432, rotation: 180}
defaults: {material: u750-18, edgeband: eb-u750-1}
back: {}
plinth: {}

panels:

- id: shelf-1450
  name: "Open shelf 1450"
  element_type: panel
  role: wall-shelf   # flat: edge 3 = front, 2 = free end, 4 = column end (banded: the CSV cannot band 2 alone)
  width: 520
  height: 250
  grain: any
  edge_banding: {edges: {3: eb-u750-2, 2: eb-u750-2, 4: eb-u750-1}, glue_type: long}
  holes:
  - {face: inner, x: 9.5, y: 50, dia: 20, depth: 14, type: multi, count: 2, spacing: 150, direction: y, src: rf-1450}
  placement: {pos: [0, 0, 0]}

- id: shelf-1903
  name: "Open shelf 1903"
  element_type: panel
  role: wall-shelf   # flat: edge 3 = front, 2 = free end, 4 = column end (banded: the CSV cannot band 2 alone)
  width: 520
  height: 250
  grain: any
  edge_banding: {edges: {3: eb-u750-2, 2: eb-u750-2, 4: eb-u750-1}, glue_type: long}
  holes:
  - {face: inner, x: 9.5, y: 50, dia: 20, depth: 14, type: multi, count: 2, spacing: 150, direction: y, src: rf-1903}
  placement: {pos: [0, 0, 453]}

assembly:
  fittings:
  - {id: br-1450, hardware: angle-bracket-40, drilling: none, quantity: 2}   # under the back edge, wall to shelf (on site)
  - {id: br-1903, hardware: angle-bracket-40, drilling: none, quantity: 2}   # under the back edge, wall to shelf (on site)
  - {id: rf-1450, hardware: rafix-20, drilling: manual, through: shelf-1450, at: [50, 200]}   # bolts in ew-upper side-r
  - {id: rf-1903, hardware: rafix-20, drilling: manual, through: shelf-1903, at: [50, 200]}   # bolts in ew-upper side-r
