  holes:
  - {face: inner, x: 22.5, y: 100, dia: 35, depth: 12, type: multi, count: 2, spacing: 354, direction: y, src: hg-up-l}
  placement: {pos: [23, -18, 1873]}

- id: door-up-r
  name: "Door upper right"
  element_type: panel
  role: front
  width: 506
  height: 554
  grain: any
  edge_banding: {all_edges: true, band: eb-u750-2, glue_type: long}
  holes:
  - {face: inner, x: 483.5, y: 100, dia: 35, depth: 12, type: multi, count: 2, spacing: 354, direction: y, src: hg-up-r}
  placement: {pos: [531, -18, 1873]}

assembly:
  fittings:
  # rafix: `through` = the panel with the Ø20 housing, `into` = the panel with the Ø5 bolt
  - {id: rf-l, hardware: rafix-20, drilling: manual, through: hinge-l, into: outer-l, at: [100, 657, 1214, 1771, 2328]}
  - {id: rf-r, hardware: rafix-20, drilling: manual, through: hinge-r, into: outer-r, at: [100, 657, 1214, 1771, 2328]}
  - {id: rf-1880, hardware: rafix-20, drilling: manual, through: partition, into: shelf-1880, at: [50, 440, 830]}
  - {id: pins-1355, hardware: shelf-pin-5, drilling: manual, at: [1337], quantity: 3, shelves: [shelf-1355]}   # its partition end
  - {id: rf-1355-short, hardware: rafix-20, drilling: manual, through: short-board, into: shelf-1355, at: [90, 440]}
  - {id: rf-coats, hardware: rafix-20, drilling: manual, through: shelf-coats, into: partition, at: [50, 230], quantity: 6}
  - {id: rf-vac-part, hardware: rafix-20, drilling: manual, through: shelf-vac, into: partition, at: [80, 470], quantity: 4}
  - {id: rf-vac-short, hardware: rafix-20, drilling: manual, through: shelf-vac, into: short-board, at: [80, 470], quantity: 4}
  # inset hinges, cup heights from the floor
  - {id: hg-low-l, hardware: hinge-clip-110, variant: inset, drilling: manual, door: door-low-l, side: hinge-l, at: [110, 663, 1216, 1769]}
  - {id: hg-low-r, hardware: hinge-clip-110, variant: inset, drilling: manual, door: door-low-r, side: hinge-r, at: [110, 663, 1216, 1769]}
  - {id: hg-up-l, hardware: hinge-clip-110, variant: inset, drilling: manual, door: door-up-l, side: hinge-l, at: [1973, 2327]}
  - {id: hg-up-r, hardware: hinge-clip-110, variant: inset, drilling: manual, door: door-up-r, side: hinge-r, at: [1973, 2327]}

parts: []
