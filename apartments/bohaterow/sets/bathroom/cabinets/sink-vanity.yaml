  role: drawer-side           # MIRROR of d2-side-l. Frame like `side-right`: local x 0 = the drawer's
                              # FRONT, so edge4 is the front end and edge2 the back end — the opposite
                              # of d2-side-l, which is exactly what mirrors the 50/100 vs 30/70 sets.
