assembly:
  fittings:

  # --- CARCASS: MINIFIX. `meble fit` cannot stamp minifix (fittings.py skips non-butt hardware), so
  #     every hole for these four lives hand-written on the panels above, tagged with these ids.
  #     bottom -> sides: `at` is measured from the WALL along the 450 mm depth and is SYMMETRIC about the
  #     225 mid-depth. That symmetry is load-bearing: side-l's local x runs from the wall but side-r's
  #     runs from the FRONT, so only a symmetric set lands on the same physical points from both frames.
  - {id: mf-bot-l, hardware: minifix-15, through: bottom, into: side-l, seam: {through_edge: 4, into_face: inner}, at: [50, 225, 400]}
  - {id: mf-bot-r, hardware: minifix-15, through: bottom, into: side-r, seam: {through_edge: 2, into_face: inner}, at: [50, 225, 400]}
  #     stretcher -> sides: `at` is the height above the STRETCHER's own bottom edge, so 25/75 land at
  #     cabinet z 405/455. Only 2 cams per end — the panel is 100 tall and this is the practical spacing.
  - {id: mf-rail-l, hardware: minifix-15, through: rail-top, into: side-l, seam: {through_edge: 4, into_face: inner}, at: [25, 75]}
  - {id: mf-rail-r, hardware: minifix-15, through: rail-top, into: side-r, seam: {through_edge: 2, into_face: inner}, at: [25, 75]}

  # --- DRAWER SCREW COUNT: ONE confirmat on a SHORT seam (the four vertical corners, 100–150 mm),
  #     TWO on a LONG seam (bottom -> walls, 314 and 498 mm). 12 screws per box instead of 20.
  #     A single screw per corner cannot pivot here because the bottom panel is screwed to BOTH panels
  #     of every corner, which is what locks the joint against rotation.
  #     Bonus: every position now clears the 50 mm confirmat end margin, so `meble review` is silent.

  # --- BOTTOM DRAWER: all confirmat, all heads hidden. These are clean perimeter butt joints with
  #     aligned origins, so `meble fit` stamps them.
  #     Corners: `at` = height up the seam, measured from the bottom on BOTH panels. 50 = mid-height of
  #     a 100 mm edge, and exactly the 50 mm end margin at both ends.
  - {id: cf-d1-fl, hardware: confirmat-7x50, through: d1-front, into: d1-side-l, seam: {through_edge: 4, into_edge: 2}, at: [50]}
  - {id: cf-d1-fr, hardware: confirmat-7x50, through: d1-front, into: d1-side-r, seam: {through_edge: 2, into_edge: 4}, at: [50]}
  #     The back reads its frame right-to-left, so its edge2 meets the LEFT side and edge4 the right.
  - {id: cf-d1-bl, hardware: confirmat-7x50, through: d1-back, into: d1-side-l, seam: {through_edge: 2, into_edge: 4}, at: [50]}
  - {id: cf-d1-br, hardware: confirmat-7x50, through: d1-back, into: d1-side-r, seam: {through_edge: 4, into_edge: 2}, at: [50]}
  #     Bottom -> front/back: heads on the bottom's underside. `at` runs along the 498 width. Symmetric
  #     about 249 because the back panel reads its frame right-to-left.
  - {id: cf-d1-bot-f, hardware: confirmat-7x50, through: d1-bottom, into: d1-front, seam: {through_edge: 1, into_edge: 3}, at: [125, 373]}
  - {id: cf-d1-bot-b, hardware: confirmat-7x50, through: d1-bottom, into: d1-back, seam: {through_edge: 3, into_edge: 3}, at: [125, 373]}
  #     Bottom -> sides: NO `through_edge` on purpose, so `fit` skips them instead of stamping them
  #     wrong (the sides start 18 mm in from the bottom panel's front edge). Holes hand-written above.
  #     `at` = distance along the SIDE's own bottom edge; symmetric about 157 so both sides share it.
  - {id: cf-d1-bot-sl, hardware: confirmat-7x50, through: d1-bottom, into: d1-side-l, seam: {into_edge: 3}, at: [80, 234]}
  - {id: cf-d1-bot-sr, hardware: confirmat-7x50, through: d1-bottom, into: d1-side-r, seam: {into_edge: 3}, at: [80, 234]}

  # --- TOP DRAWER: same shapes, but the front (150) and back (100) are separate panels with separate
  #     end-screw heights, which is what makes d2-side-l / d2-side-r a mirror pair.
  #     75 = mid-height of the 150 mm front; 50 = mid-height of the 100 mm back.
  - {id: cf-d2-fl, hardware: confirmat-7x50, through: d2-front, into: d2-side-l, seam: {through_edge: 4, into_edge: 2}, at: [75]}
  - {id: cf-d2-fr, hardware: confirmat-7x50, through: d2-front, into: d2-side-r, seam: {through_edge: 2, into_edge: 4}, at: [75]}
  #     The back reads its frame right-to-left, so its edge2 meets the LEFT side and edge4 the right.
  - {id: cf-d2-bl, hardware: confirmat-7x50, through: d2-back, into: d2-side-l, seam: {through_edge: 2, into_edge: 4}, at: [50]}
  - {id: cf-d2-br, hardware: confirmat-7x50, through: d2-back, into: d2-side-r, seam: {through_edge: 4, into_edge: 2}, at: [50]}
  - {id: cf-d2-bot-f, hardware: confirmat-7x50, through: d2-bottom, into: d2-front, seam: {through_edge: 1, into_edge: 3}, at: [125, 373]}
  - {id: cf-d2-bot-b, hardware: confirmat-7x50, through: d2-bottom, into: d2-back, seam: {through_edge: 3, into_edge: 3}, at: [125, 373]}
  - {id: cf-d2-bot-sl, hardware: confirmat-7x50, through: d2-bottom, into: d2-side-l, seam: {into_edge: 3}, at: [80, 234]}
  - {id: cf-d2-bot-sr, hardware: confirmat-7x50, through: d2-bottom, into: d2-side-r, seam: {into_edge: 3}, at: [80, 234]}

  hardware:
    # Documentary only — the loader reads assembly.fittings and ignores this key (same as
    # library/parts/drawer-box-500x400.yaml). Nothing here is drilled: see SLIDES in the header.
  - {ref: slide-bb-350, quantity: 2}     # one pair per drawer; cabinet member at y 0..350

